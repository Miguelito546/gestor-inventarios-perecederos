{% extends "base.html" %}
{% block titulo %}Registrar lote{% endblock %}
{% block contenido %}
<h1>Registrar lote (RF-006)</h1>
<form method="post" class="tarjeta formulario angosto">
  <label>Insumo <select name="id_insumo" required><option value="">Selecciona…</option>
    {% for i in insumos %}<option value="{{ i.id_insumo }}" {% if d.id_insumo == i.id_insumo|string %}selected{% endif %}>{{ i.nombre }} ({{ i.unidad_medida }})</option>{% endfor %}</select></label>
  <label>Proveedor <select name="id_proveedor" required><option value="">Selecciona…</option>
    {% for p in proveedores %}<option value="{{ p.id_proveedor }}" {% if d.id_proveedor == p.id_proveedor|string %}selected{% endif %}>{{ p.nombre_empresa }}</option>{% endfor %}</select></label>
  <label>Cantidad <input name="cantidad" type="number" step="0.01" min="0.01" value="{{ d.cantidad or '' }}" required></label>
  <div class="dos">
    <label>Fecha de recepción <input name="fecha_recepcion" type="datetime-local" value="{{ d.fecha_recepcion or '' }}" required></label>
    <label>Fecha de caducidad <input name="fecha_caducidad" type="datetime-local" value="{{ d.fecha_caducidad or '' }}" required></label>
  </div>
  <label>Equipo de almacenamiento <select name="id_equipo" required><option value="">Selecciona…</option>
    {% for e in equipos %}<option value="{{ e.id_equipo }}" {% if d.id_equipo == e.id_equipo|string %}selected{% endif %}>{{ e.nombre_equipo }} ({{ e.temp_min_permitida|num(1) }} a {{ e.temp_max_permitida|num(1) }} °C)</option>{% endfor %}</select></label>
  <label>Código de lote <small class="tenue">(opcional; si lo dejas vacío se genera)</small><input name="codigo_lote" value="{{ d.codigo_lote or '' }}" placeholder="LOT-POLLO-AAAAMMDD-01"></label>
  <button class="btn">Guardar lote</button>
</form>
{% endblock %}
