; =========================================================================
;  Conexión a la base de datos del Gestor de Inventarios Perecederos
;  Este archivo se llama conexion.ini y va en la MISMA carpeta que GestorInventarios.exe
;  (si ejecutas con Python, en la carpeta del proyecto; copia conexion.ejemplo.ini a conexion.ini)
;  Todas las computadoras deben tener los MISMOS datos para compartir la base.
; =========================================================================

[base_datos]
; ---- Opción A: base compartida en la nube (Aiven, MySQL) -----------------
; Copia estos datos de la página de tu servicio en Aiven (Overview > Connection information)
; servidor    = mysql-xxxxxxx-tu-proyecto.x.aivencloud.com
; puerto      = 12345
; usuario     = avnadmin
; contrasena  = la-contraseña-de-aiven
; nombre_base = defaultdb
; ssl         = si
; certificado_ca = ca.pem

; ---- O bien TiDB Cloud Starter (gratis): Connect > General ------------------
; servidor    = gateway01.us-east-1.prod.aws.tidbcloud.com
; puerto      = 4000
; usuario     = xxxxxxxx.root
; contrasena  = la-contraseña-generada
; nombre_base = gestor
; ssl         = si
; certificado_ca =

; ---- Opción B: MariaDB en esta computadora o en otra de la red local -------
; (para otra computadora de la red, pon su IP en servidor, por ejemplo 192.168.1.50)
servidor    = localhost
puerto      = 3307
usuario     = root
contrasena  =
nombre_base = kfc_inventory_db
ssl         = no
certificado_ca =

[aplicacion]
; Puerto para abrirla también en el navegador: http://localhost:5000
puerto       = 5000
; si = también se puede abrir desde el celular u otra PC de la misma red Wi-Fi
permitir_red = si
; Simulador IoT de temperaturas (RF-008). Solo corre en una copia a la vez.
simulador    = si
