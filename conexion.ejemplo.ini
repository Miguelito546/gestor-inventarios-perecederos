; =========================================================================
;  Conexión a la base de datos del Gestor de Inventarios Perecederos
;  Este archivo se llama conexion.ini y va en la MISMA carpeta que GestorInventarios.exe
;  Todas las computadoras deben tener los MISMOS datos para compartir la base.
;
;  IMPORTANTE: las líneas que empiezan con ";" son solo notas y el programa las ignora.
;  Cambia ÚNICAMENTE lo que está después del "=" en las líneas de abajo (sin ";").
; =========================================================================

[base_datos]
servidor    = localhost
puerto      = 3307
usuario     = root
contrasena  =
nombre_base = kfc_inventory_db
ssl         = no
certificado_ca =

; ---- Qué escribir en cada caso -------------------------------------------
;
; Aiven (MySQL en la nube). Datos de Overview > Connection information:
;   servidor    = mysql-xxxxxxx.aivencloud.com    (Host)
;   puerto      = 12345                           (Port)
;   usuario     = avnadmin                        (User)
;   contrasena  = AVNS_...                        (Password)
;   nombre_base = defaultdb                       (Database name)
;   ssl         = si
;   certificado_ca = ca.pem     (o vacío si no descargaste el certificado)
;
; TiDB Cloud Starter (gratis). Datos de Connect > General:
;   servidor    = gateway01.us-east-1.prod.aws.tidbcloud.com
;   puerto      = 4000
;   usuario     = xxxxxxxx.root
;   contrasena  = la contraseña generada
;   nombre_base = gestor
;   ssl         = si
;   certificado_ca =
;
; MariaDB en esta computadora (los valores de arriba) o en otra PC de la red:
;   servidor = la IP de esa PC, por ejemplo 192.168.1.50 ; ssl = no

[aplicacion]
; Puerto para abrirla también en el navegador: http://localhost:5000
puerto       = 5000
; si = también se puede abrir desde el celular u otra PC de la misma red Wi-Fi
permitir_red = si
; Simulador IoT de temperaturas (RF-008). Solo corre en una copia a la vez.
simulador    = si
